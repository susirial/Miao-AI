name: Feature request
description: Suggest a model, workflow, or product improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Miao AI is a local-first creative assistant for mainland-China model providers, with agent chat and an infinite canvas.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Models / providers
        - Agent / skills
        - Canvas / studio
        - Desktop
        - Docs / DX
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is awkward or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Miao do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered.
